[package]
name = "frontend"
version.workspace = true
edition.workspace = true

[dependencies]
shared.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
console_error_panic_hook = "0.1"
# Icons: Lucide only, compiled as inline SVG.
leptos_icons = "0.7"
icondata = { version = "0.7", default-features = false, features = ["lucide"] }
# leptos-use 0.20 split into micro crates; depend on only what we use.
leptos-use-storage = "0.20"
leptos-use-media-query = "0.20"
codee = "0.3"
