[workspace]
resolver = "2"
members = ["crates/shared", "crates/backend", "crates/frontend"]
# Frontend targets wasm32; keep plain `cargo build/test` scoped to native crates.
default-members = ["crates/shared", "crates/backend"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
shared = { path = "crates/shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
